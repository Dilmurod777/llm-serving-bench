name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pytest
      # No GPU on CI: the VRAM readers are mocked, gpu_name() degrades to "unknown".
      - run: pytest -q
